<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Edit Profile View</title>
    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <style>
        :root {
            --bg-cream: #FAF6F0;
            --primary-gold: #C5A880;
            --text-dark: #2D2D2D;
            --text-muted: #7E7E7E;
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
            --radius-md: 14px;
            --radius-lg: 24px;
            --divider-color: #F4EFEA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Mobile Device Simulation */
        .phone-container {
            width: 100%;
            max-width: 410px;
            height: 840px;
            background-color: var(--bg-cream);
            border: 8px solid #2d2d2d;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
            overflow-y: auto;
            position: relative;
            scrollbar-width: none;
        }

        .phone-container::-webkit-scrollbar {
            display: none;
        }

        .app-content {
            padding: 24px 20px 100px 20px;
        }

        /* Top Bar with Back Button Navigation */
        .top-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .btn-back {
            background: #FFFFFF;
            border: 1px solid var(--divider-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: var(--divider-color);
        }

        .nav-title {
            font-size: 16px;
            font-weight: 700;
            color: #1A1A1A;
        }

        .placeholder-right {
            width: 38px;
        }

        /* Interactive Photo Upload Space */
        .edit-avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }

        .avatar-wrapper {
            position: relative;
            cursor: pointer;
        }

        .avatar-image-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgba(197, 168, 128, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: 700;
            color: var(--primary-gold);
            border: 3px solid #FFFFFF;
            box-shadow: 0 4px 14px rgba(197, 168, 128, 0.15);
        }

        .edit-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 30px;
            height: 30px;
            background-color: var(--primary-gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .edit-badge .material-icons-outlined {
            font-size: 16px;
        }

        .upload-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-gold);
            margin-top: 10px;
            cursor: pointer;
        }

        /* Form Layout Architecture */
        .form-card {
            background: #FFFFFF;
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
        }

        .form-section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 18px;
            color: #1A1A1A;
        }

        /* Fields Styling Grid */
        .field-box {
            position: relative;
            margin-bottom: 18px;
        }

        .field-box label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .material-icons-outlined {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 20px;
        }

        .input-wrapper .suffix-lock {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 1px solid #E4E4E4;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            outline: none;
            background-color: #FFFFFF;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.08);
        }

        /* Locked field logic */
        .form-input.disabled {
            background-color: #F8F9FA;
            border-color: #EAEAEA;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Chips Selectors */
        .chips-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .choice-chip {
            padding: 10px 20px;
            border: 1px solid #E0E0E0;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            background: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .choice-chip.selected {
            background-color: var(--primary-gold);
            border-color: var(--primary-gold);
            color: #FFFFFF;
            box-shadow: 0 4px 10px rgba(197, 168, 128, 0.2);
        }

        /* Action Save Trigger Button */
        .btn-submit-save {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-gold);
            border: none;
            border-radius: var(--radius-md);
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(197, 168, 128, 0.25);
            transition: all 0.2s ease;
        }

        .btn-submit-save:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="app-content">
            
            <!-- Top Navigation Stack Bar -->
            <div class="top-nav-bar">
                <button class="btn-back" onclick="window.history.back()">
                    <span class="material-icons-outlined" style="font-size: 18px;">arrow_back</span>
                </button>
                <span class="nav-title">Edit Profile</span>
                <div class="placeholder-right"></div>
            </div>

            <!-- Profile Media Upload Node -->
            <div class="edit-avatar-container">
                <div class="avatar-wrapper">
                    <div class="avatar-image-circle">S</div>
                    <div class="edit-badge">
                        <span class="material-icons-outlined">camera_alt</span>
                    </div>
                </div>
                <span class="upload-label">Change Profile Photo</span>
            </div>

            <!-- Core Profile Modifiers Form Block -->
            <div class="form-card">
                <h3 class="form-section-title">Personal Information</h3>

                <!-- Full Name Field -->
                <div class="field-box">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <span class="material-icons-outlined">person_outline</span>
                        <input type="text" class="form-input" id="userNameInput" value="Satvik Dev">
                    </div>
                </div>

                <!-- Protected Identity Email Lockout Pattern -->
                <div class="field-box">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <span class="material-icons-outlined">mail_outline</span>
                        <input type="email" class="form-input disabled" value="satvik.it.dev@gmail.com" readonly>
                        <span class="material-icons-outlined suffix-lock">lock_outline</span>
                    </div>
                </div>

                <!-- Date Context Parameter -->
                <div class="field-box">
                    <label>Date of Birth</label>
                    <div class="input-wrapper">
                        <span class="material-icons-outlined">cake</span>
                        <input type="text" class="form-input" value="15-08-2002">
                    </div>
                </div>

                <!-- Gender Chips Row -->
                <div class="field-box">
                    <label>Gender</label>
                    <div class="chips-row">
                        <button class="choice-chip selected">Male</button>
                        <button class="choice-chip">Female</button>
                        <button class="choice-chip">Other</button>
                    </div>
                </div>
            </div>

            <!-- Form Data Persistence Submission Trigger -->
            <button class="btn-submit-save" onclick="handleSave()">Save Changes</button>

        </div>
    </div>

    <script>
        // Simple interactivity for the gender choice chips selector
        const chips = document.querySelectorAll('.choice-chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
            });
        });

        function handleSave() {
            alert('Changes committed securely! Returning safely to the profile hub router view.');
            window.history.back();
        }
    </script>
</body>
</html>
